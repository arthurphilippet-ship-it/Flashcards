<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flashcards CPGE</title>
<style>
:root{--bg:#f6f6f3;--card:#fff;--tx:#1d1d1b;--mut:#77756e;--bd:#e3e1db;--ac:#4f6bed;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#161615;--card:#212120;--tx:#f0efe9;--mut:#9a978f;--bd:#33332f}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#161615;--card:#212120;--tx:#f0efe9;--mut:#9a978f;--bd:#33332f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:8px;margin-bottom:16px}
header h1{font-size:20px;margin:0;flex:1}
button,select,input,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:10px 14px;cursor:pointer;min-height:44px}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.sm{padding:6px 10px;min-height:34px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.deck{background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--c);border-radius:12px;padding:14px;cursor:pointer}
.deck b{font-size:17px}.deck .n{font-size:28px;font-weight:700;color:var(--c)}.deck small{color:var(--mut);display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.stats{color:var(--mut);font-size:14px;margin:4px 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-top:6px solid var(--c);border-radius:16px;min-height:280px;padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font-size:20px;cursor:pointer;gap:12px}
.card img{max-width:100%;max-height:220px;border-radius:8px}
.card .tag{font-size:13px;color:var(--mut)}
.card hr{width:60%;border:0;border-top:1px dashed var(--bd)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.grades .btn{padding:14px 4px;font-weight:600}
.prog{height:6px;background:var(--bd);border-radius:3px;margin-bottom:14px}.prog i{display:block;height:100%;background:var(--ac);border-radius:3px}
.item{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--c);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.item div{flex:1;min-width:0}.item .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item small{color:var(--mut)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal form{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:16px;display:flex;flex-direction:column;gap:10px}
.modal input,.modal textarea,.modal select,.search{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
.kb{color:var(--mut);font-size:12px;text-align:center;margin-top:10px}
.empty{color:var(--mut);text-align:center;padding:40px 0}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const SUBJ={"Maths":"#4f6bed","Physique":"#e0573f","Chimie":"#2a9d6f","SI":"#d98a1c","Info":"#8e5bd6","Anglais":"#d6498f"};
const KEY="flashcards-cpge-v1";
const today=()=>Math.floor(Date.now()/864e5);
let D={cards:[],streak:0,last:0,done:{}};
try{const r=localStorage.getItem(KEY);if(r)D=JSON.parse(r)}catch(e){}
if(!D.cards.length&&!D.seeded){D.seeded=1;D.cards=[
{s:"Maths",c:"Analyse – Limites",f:"Définition de la limite finie d’une suite (uₙ) en +∞",b:"∀ε>0, ∃N∈ℕ, ∀n≥N, |uₙ − ℓ| ≤ ε"},
{s:"Physique",c:"Mécanique",f:"Énoncé de la 2ᵉ loi de Newton",b:"Σ F = m·a (référentiel galiléen)"},
{s:"Chimie",c:"Cinétique",f:"Loi d’Arrhenius",b:"k = A·exp(−Eₐ / RT)"}
].map(x=>({id:Math.random().toString(36).slice(2),s:x.s,c:x.c,f:x.f,b:x.b,img:"",ease:2.5,int:0,reps:0,due:0}))}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])).replace(/\n/g,"<br>");
const $=h=>{document.getElementById("app").innerHTML=h};
let view="home",subj="",q="",queue=[],total=0,shown=false;
const due=s=>D.cards.filter(c=>(!s||c.s===s)&&c.due<=today());

let L="";
function readHash(){let h="";try{h=decodeURIComponent(location.hash.slice(1))}catch(e){}L=SUBJ[h]?h:"";subj=L;home()}
function sHome(){
 view="home";const s=L,n=D.cards.filter(c=>c.s===s).length,t=D.done[today()]||0,ch=new Set(D.cards.filter(c=>c.s===s).map(c=>c.c)).size;
 $(`<header><h1 style="color:${SUBJ[s]}">🎓 Flashcards ${s}</h1><button class="btn sm" onclick="theme()">◐</button></header>
 <div class="deck" style="--c:${SUBJ[s]}" onclick="review('${s}')"><div class="n">${due(s).length}</div><small>à réviser · ${n} carte${n>1?"s":""} · ${ch} chapitre${ch>1?"s":""}</small></div>
 <div class="stats" style="margin-top:12px">Aujourd’hui : ${t} révisée${t>1?"s":""} · Série : ${D.streak} jour${D.streak>1?"s":""}</div>
 <div class="row"><button class="btn p" onclick="review('${s}')">▶ Réviser</button><button class="btn" onclick="form()">＋ Nouvelle carte</button><button class="btn" onclick="browse()">☰ Mes cartes</button></div>
 <div class="row"><button class="btn sm" onclick="exp()">⬇ Exporter</button><label class="btn sm">⬆ Importer<input type="file" accept=".json" hidden onchange="imp(this)"></label></div>`)}
function home(){
 if(L)return sHome();view="home";
 const t=D.done[today()]||0;
 $(`<header><h1>🎓 Flashcards CPGE</h1><button class="btn sm" onclick="theme()">◐</button></header>
 <div class="stats">Aujourd’hui : ${t} révisée${t>1?"s":""} · Série : ${D.streak} jour${D.streak>1?"s":""} · ${D.cards.length} cartes</div>
 <div class="grid">${Object.keys(SUBJ).map(s=>{const n=D.cards.filter(c=>c.s===s).length;return `<div class="deck" style="--c:${SUBJ[s]}" onclick="review('${s}')"><b>${s}</b><div class="n">${due(s).length}</div><small>à réviser · ${n} carte${n>1?"s":""}</small></div>`}).join("")}</div>
 <div class="row"><button class="btn p" onclick="review('')">▶ Tout réviser (${due("").length})</button><button class="btn" onclick="form()">＋ Nouvelle carte</button><button class="btn" onclick="browse()">☰ Mes cartes</button></div>
 <div class="row"><button class="btn sm" onclick="exp()">⬇ Exporter</button><label class="btn sm">⬆ Importer<input type="file" accept=".json" hidden onchange="imp(this)"></label></div>`)}

function review(s){
 subj=s;queue=due(s).sort(()=>Math.random()-.5);total=queue.length;shown=false;view="rev";draw()}
function draw(){
 if(!queue.length){
  $(`<header><button class="btn sm" onclick="home()">←</button><h1>${subj||"Toutes les matières"}</h1></header><div class="empty">🎉<br>${total?"Session terminée, bravo !":"Rien à réviser pour le moment."}</div><div class="row" style="justify-content:center"><button class="btn p" onclick="home()">Retour</button></div>`);return}
 const c=queue[0],col=SUBJ[c.s];
 $(`<header><button class="btn sm" onclick="home()">←</button><h1>${subj||"Toutes les matières"}</h1><span class="stats">${total-queue.length}/${total}</span></header>
 <div class="prog"><i style="width:${(total-queue.length)/total*100}%"></i></div>
 <div class="card" style="--c:${col}" onclick="flip()"><div class="tag">${c.s} · ${esc(c.c)}</div><div>${esc(c.f)}</div>
 ${shown?`<hr><div>${esc(c.b)}</div>${c.img?`<img src="${c.img}" alt="">`:""}`:`<small class="tag">Touche pour voir la réponse</small>`}</div>
 ${shown?`<div class="grades"><button class="btn" style="border-color:#d33" onclick="grade(0)">À revoir<br><small>1</small></button><button class="btn" onclick="grade(1)">Difficile<br><small>2</small></button><button class="btn" onclick="grade(2)">Bien<br><small>3</small></button><button class="btn" onclick="grade(3)">Facile<br><small>4</small></button></div>`:`<div class="grades" style="grid-template-columns:1fr"><button class="btn p" onclick="flip()">Afficher la réponse</button></div>`}
 <div class="kb">Espace : retourner · 1-4 : noter</div>`)}
function flip(){shown=true;draw()}
function grade(g){
 const c=queue.shift();
 if(g===0){c.reps=0;c.int=0;c.ease=Math.max(1.3,c.ease-.2);c.due=today();queue.push(c)}
 else{
  if(g===1){c.int=Math.max(1,Math.round((c.int||1)*1.2));c.ease=Math.max(1.3,c.ease-.15)}
  else if(g===2){c.int=c.reps==0?1:c.reps==1?3:Math.round(c.int*c.ease)}
  else{c.int=c.reps==0?3:Math.round(Math.max(c.int,1)*c.ease*1.3);c.ease+=.15}
  c.reps++;c.due=today()+c.int;
  const t=today();D.done[t]=(D.done[t]||0)+1;
  if(D.last!==t){D.streak=D.last===t-1?D.streak+1:1;D.last=t}
 }
 save();shown=false;draw()}

function browse(){
 view="browse";
 const l=D.cards.filter(c=>(!subj||c.s===subj)&&(c.f+c.b+c.c).toLowerCase().includes(q.toLowerCase()));
 $(`<header><button class="btn sm" onclick="subj=L;q='';home()">←</button><h1>Mes cartes</h1><button class="btn p sm" onclick="form()">＋</button></header>
 <div class="row"><input class="search" id="q" placeholder="Rechercher…" value="${esc(q)}" oninput="q=this.value;browse();document.getElementById('q').focus()" style="flex:2"><select class="search" style="flex:1;${L?"display:none":""}" onchange="subj=this.value;browse()"><option value="">Toutes</option>${Object.keys(SUBJ).map(s=>`<option ${s===subj?"selected":""}>${s}</option>`).join("")}</select></div>
 ${l.length?l.map(c=>`<div class="item" style="--c:${SUBJ[c.s]}"><div><div class="t">${esc(c.f)}</div><small>${c.s} · ${esc(c.c)}</small></div><button class="btn sm" onclick="form('${c.id}')">✎</button><button class="btn sm" onclick="del('${c.id}')">🗑</button></div>`).join(""):`<div class="empty">Aucune carte.</div>`}`)}
function del(id){if(confirm("Supprimer cette carte ?")){D.cards=D.cards.filter(c=>c.id!==id);save();browse()}}

let tmpImg="";
function form(id){
 const c=D.cards.find(x=>x.id===id)||{s:subj||"Maths",c:"",f:"",b:"",img:""};tmpImg=c.img||"";
 const m=document.createElement("div");m.className="modal";m.id="m";
 m.innerHTML=`<form onsubmit="return false"><b>${id?"Modifier":"Nouvelle"} carte</b>
 <select id="fs">${Object.keys(SUBJ).map(s=>`<option ${s===c.s?"selected":""}>${s}</option>`).join("")}</select>
 <input id="fc" placeholder="Chapitre" value="${esc(c.c).replace(/<br>/g," ")}">
 <textarea id="ff" rows="3" placeholder="Recto (question / notion)">${c.f.replace(/</g,"&lt;")}</textarea>
 <textarea id="fb" rows="4" placeholder="Verso (définition / théorème)">${c.b.replace(/</g,"&lt;")}</textarea>
 <input type="file" accept="image/*" onchange="pic(this)"><small id="pi">${tmpImg?"Image jointe ✓":""}</small>
 <div class="row"><button class="btn p" onclick="ok('${id||""}')">Enregistrer</button><button class="btn" onclick="document.getElementById('m').remove()">Annuler</button></div></form>`;
 document.body.appendChild(m)}
function pic(i){
 const f=i.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,800/im.width),cv=document.createElement("canvas");cv.width=im.width*k;cv.height=im.height*k;cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);tmpImg=cv.toDataURL("image/jpeg",.7);document.getElementById("pi").textContent="Image jointe ✓"};im.src=r.result};r.readAsDataURL(f)}
function ok(id){
 const v=n=>document.getElementById(n).value.trim();
 if(!v("ff")||!v("fb")){alert("Recto et verso sont requis.");return}
 const d={s:v("fs"),c:v("fc")||"Général",f:v("ff"),b:v("fb"),img:tmpImg};
 if(id)Object.assign(D.cards.find(c=>c.id===id),d);
 else D.cards.push({id:Math.random().toString(36).slice(2),...d,ease:2.5,int:0,reps:0,due:0});
 save();document.getElementById("m").remove();view==="browse"?browse():home()}

function exp(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:"application/json"}));a.download="flashcards.json";a.click()}
function imp(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.cards))throw 0;D=d;save();home()}catch(e){alert("Fichier invalide.")}};r.readAsText(f)}
function theme(){const r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark"}
document.addEventListener("keydown",e=>{
 if(view!=="rev"||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||!queue.length)return;
 if(e.code==="Space"){e.preventDefault();if(!shown)flip()}
 else if(shown&&"1234".includes(e.key))grade(+e.key-1)});
addEventListener("hashchange",readHash);readHash();
</script>
</body>
</html>
